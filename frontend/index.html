<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Iveco Bayi CRM - Müşteri İstihbarat ve Satış Operasyon Platformu" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IVECO CRM" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <title>Iveco CRM — Müşteri İstihbarat Platformu</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body style="margin: 0; background-color: #0f172a; color: #f8fafc;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(2, 132, 199, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: crm-spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-weight: 700; color: #f8fafc; font-size: 16px; letter-spacing: 0.5px;">IVECO CRM</div>
        <div style="font-size: 12px; margin-top: 6px; color: #64748b;">Yükleniyor...</div>
      </div>
      <style>
        @keyframes crm-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully:', reg.scope))
            .catch(err => console.error('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
